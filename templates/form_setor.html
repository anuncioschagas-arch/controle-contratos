{% extends "base.html" %}
{% block title %}{{ titulo }} — Controle de Contratos{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ titulo }}</h1>
    <a href="/setores" class="btn btn-outline">← Voltar</a>
</div>

<div class="card">
    <form method="post" action="{{ action }}">
        <div class="form-grid">
            <div class="form-group">
                <label>Contratante *</label>
                <select name="contratante_id" required>
                    <option value="">— Selecione —</option>
                    {% for ct in contratantes %}
                    <option value="{{ ct.id }}" {% if item and item.contratante_id == ct.id %}selected{% endif %}>#{{ ct.id }} — {{ ct.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Nome do Setor *</label>
                <input type="text" name="nome" value="{{ item.nome if item else '' }}" required>
            </div>
            <div class="form-group">
                <label>Responsável</label>
                <input type="text" name="responsavel" value="{{ item.responsavel if item else '' }}">
            </div>
            <div class="form-group">
                <label>Celular</label>
                <input type="text" name="nrcelular" value="{{ item.nrcelular if item else '' }}" placeholder="(11) 99999-9999">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/setores" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
