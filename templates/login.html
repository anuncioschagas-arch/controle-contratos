<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Controle de Contratos</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body.login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #edf2f7;
        }
        .login-box {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 380px;
            border: 1px solid #e2e8f0;
        }
        .login-box h1 {
            font-size: 1.25rem;
            color: #1a365d;
            margin-bottom: 0.25rem;
            text-align: center;
        }
        .login-box .sub {
            text-align: center;
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .login-box .form-group { margin-bottom: 1rem; }
        .login-box label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a365d;
            margin-bottom: 0.3rem;
        }
        .login-box input {
            width: 100%;
            padding: 0.55rem 0.7rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .login-box button {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.6rem;
        }
        .login-hint {
            margin-top: 1.25rem;
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: center;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-box">
        <h1>Controle de Contratos</h1>
        <p class="sub">Acesso restrito a usuários autorizados</p>
        {% if message %}
        <div class="alert alert-{{ message_type or 'error' }}">{{ message }}</div>
        {% endif %}
        <form method="post" action="/login">
            <div class="form-group">
                <label>Login</label>
                <input type="text" name="login" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="senha" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <p class="login-hint">Política de segurança: sessão autenticada obrigatória</p>
    </div>
</body>
</html>
