services:
  - type: web
    name: controle-contratos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: CONTRATOS_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
    disk:
      name: contratos-data
      mountPath: /data
      sizeGB: 1
