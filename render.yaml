services:
  - type: web
    name: controle-contratos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: CONTRATOS_SECRET
        generateValue: true
